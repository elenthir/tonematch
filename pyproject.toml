[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonematch"
version = "0.1.0"
description = "Autonomously match a recorded guitar tone with your own plugins (Neural DSP & co.), export to REAPER"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "librosa>=0.10", "soundfile>=0.12",
  "pedalboard>=0.9.14", "optuna>=3.6", "cmaes>=0.10", "pyyaml>=6", "matplotlib>=3.8", "rich>=13",
]

[project.optional-dependencies]
separate = ["demucs>=4.0", "torch>=2.1", "torchaudio>=2.1"]
download = ["yt-dlp>=2024.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
tonematch = "tonematch.cli:main"

[tool.setuptools]
packages = ["tonematch"]
include-package-data = true

[tool.setuptools.package-data]
tonematch = ["knobs/*.yaml", "reaper/*.lua"]
