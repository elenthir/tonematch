# Knob map: how tonematch interprets plugins and their parameters.
#
# Rules are regexes matched case-insensitively. Later files (passed with --knobs) are merged on
# top of this one, and the first `plugins:` entry whose `match` hits the plugin name wins for the
# per-plugin overrides. If you already have a hand-made map of your Neural DSP knobs, put it in a
# file like this (see README "Knob maps") — every list below accepts exact names as well as regexes.
#
# Parameter kinds:
#   primary   searched first and always (gain / tone stack / amp or cab choice)
#   secondary searched once a chain survives the screening stage
#   ambience  reverb / delay / modulation — frozen OFF unless you run with --allow-ambience
#   fixed     set to the given normalised value and never touched
#   excluded  never touched (left at the plugin default)

roles:                       # plugin name/category -> role. Checked top to bottom, first hit wins.
  # Roles that are never used in a guitar chain come first, so "Darkglass Ultra" is bass before
  # it is "amp", and a drum sampler is never mistaken for anything else. Override per plugin with
  # a `plugins:` entry (`role: amp_suite`) if one of yours is misfiled.
  instrument:                # synths, samplers, drum / bass / piano instruments (pedalboard's own flag is also used)
    - "\\binstrument\\b"
    - "drum"
    - "\\bkit\\b"
    - "piano"
    - "synth"
    - "sampler"
    - "kontakt"
    - "superior"
    - "addictive"
    - "ezdrummer|ezbass|ezkeys"
    - "ggd|get good drums"
    - "serum|massive|vital|diva|omnisphere|pigments|phase plant"
    - "neuralnote|neural note"
    - "modo bass|trilian|ample"
  bass:                      # bass amp sims / suites
    - "\\bbass\\b"
    - "darkglass"
    - "parallax"
    - "ampeg|svt"
    - "b7k|microtubes|alpha omega"
    - "bassforge|bass rig|rig for bass"
    - "submission"
  utility:                   # not tone shaping, or vocal / mastering tools
    - "tuner"
    - "meter|analy[sz]er|\\bspan\\b|scope"
    - "limiter|maximi[sz]er|clipper"
    - "vocal|voice|auto-?tune|melodyne|de-?ess"
    - "pitch|transpose|harmoni[sz]er|octaver"
    - "ozone|neutron|nectar|mastering"
    - "dither|stereo|imager|mid/side|m/s"
    - "reatune|reainsert|reafir|reasurround|reavoice|reaxcomp|reacontrolmidi|reajs|reanin"
    - "noise reduction|denoise|restoration|rx\\b"
    - "spectral|vocoder|freeze"
    - "loudness|lufs"
    - "time stretch|elastique|resampl"
  nam_player:                # the NAM plugin itself: used to *load* a capture in REAPER, never searched blind
    - "neural ?amp ?modeler|neuralampmodeler"
  modulation:                # chorus / flanger / vibe / phaser / tremolo pedals: not tone, never chained
    - "chorus|flang|vibe|phas|tremolo|vibrato|rotary|leslie|mistress|terraform|ensemble|dimension"
  amp_suite:                 # all-in-one: pedals + amp + cab + post FX  (one of these is a whole chain)
    - "archetype"
    - "neural dsp"
    - "fortin"
    - "soldano"
    - "amplitube"
    - "bias fx"
    - "helix"
    - "guitar rig"
    - "th-u"
    - "tonex"
    - "overloud"
    - "gojira"
    - "nameless"
    - "omega"
    - "mesa"
    - "petrucci"
    - "plini"
    - "rabea"
    - "abasi"
    - "tim henson"
    - "cory wong"
    - "mateus asato"
    - "nolly"
    - "morgan"
    - "mp1"
    - "tone king"
    - "imperial"
  amp:
    - "\\bamp\\b"
    - "amplifier"
    - "bias amp"
    - "nam\\b"
    - "neural amp modeler"
  cab:
    - "\\bcab"
    - "\\bir\\b"
    - "impulse"
    - "convol"
    - "two notes"
    - "wall of sound"
  drive:
    - "overdrive"
    - "distortion"
    - "\\bfuzz"
    - "screamer"
    - "boost"
    - "\\bdrive\\b"
    - "klon"
    - "rat\\b"
    - "muff|screamer|ts-?9|ts-?808|ds-?1|metal zone|od-?1|blues driver|precision drive"
  gate:
    - "\\bgate\\b"
  compressor:
    - "compress"
  eq:
    - "\\beq\\b"
    - "equaliz"
    - "pro-q"
    - "reaeq"
  reverb:
    - "reverb"
    - "\\bverb\\b"
  delay:
    - "delay"
    - "echo"

params:                      # defaults applied to every plugin
  excluded:
    - "^bypass$"
    - "^wet$|^dry$|^mix$"     # keep 100 % wet on amp-ish plugins
    - "^input( gain| level| trim)?$"
    - "^output( gain| level| trim| volume)?$"
    - "^(master )?volume$"
    - "transpose"
    - "doubler"
    - "tuner"
    - "midi"
    - "preset"
    - "\\ba/b\\b"
    - "\\bpan\\b"
    - "oversampl"
    - "latency"
    - "quality"
    - "stereo|width|spread"
    - "capture|load|browse|file"
    - "scene|snapshot"
    - "metronome|tempo|sync"
    - "cab.*(active|enable|on/off|bypass)"   # never switch the cab off
  ambience:
    - "reverb"
    - "delay"
    - "echo"
    - "chorus"
    - "flang"
    - "phaser"
    - "tremolo"
    - "vibrato"
    - "wah"
    - "pitch"
    - "octav"
    - "harmon"
    - "shimmer"
  secondary:                 # checked before `primary`: fine-tuning knobs that are not worth screening on
    - "\\beq\\b.*(gain|freq|q\\b|band)|band \\d"   # graphic / parametric EQ bands
    - "\\beq\\b.*\\d+ ?k?hz\\b"                 # "Clean EQ 65 Hz" … "Lead EQ 16 kHz"
    - "\\boutput\\b"                             # per-channel output levels
    - "\\bphase\\b|polarity"                     # cab mic polarity switches
    - "(low|high|hi|lo)[ -]?(cut|pass)|hpf|lpf"
    - "mic.*(position|distance|level|pan|phase|delay)"
    - "\\blevel\\b|\\bvolume\\b|\\bmix\\b"
    - "attack|release|hold|ratio|threshold|knee"
    - "sag|bias|hum|variac|ghost|feedback|compression"
  primary:
    - "gain"
    - "drive"
    - "\\bbass\\b"
    - "\\blow\\b"
    - "\\bmid"
    - "\\btreble\\b"
    - "\\bhigh\\b"
    - "\\bhighs?\\b|\\blows?\\b|\\bmids?\\b"
    - "presence"
    - "depth"
    - "resonance"
    - "\\btone\\b"
    - "contour"
    - "bright"
    - "\\btight"
    - "amp.*(select|type|model|channel)"
    - "(select|type|model|channel).*amp"
    - "channel"
    - "cab.*(select|type|model|ir)"
    - "(ir|mic).*(select|type|model)"
    - "mic"
    - "boost"
    - "crunch|lead|rhythm|clean"
    - "\\b(active|enabled?|on/off)\\b"   # section on/off switches (pedals, cab sections, EQ)
  # everything else is secondary

plugins:
  - match: "darkglass|parallax"
    vendor: "Neural DSP"
    role: bass
  - match: "archetype|neural dsp|fortin|soldano|gojira|nameless|omega|mesa|petrucci|plini|rabea|abasi|henson|cory wong|asato|nolly|morgan|mp1|tone king|mayer"
    vendor: "Neural DSP"          # the rule also matches "<name> (Neural DSP)", i.e. any Neural DSP plugin
    role: amp_suite
    fixed:                             # name regex -> normalised value
      "\\b(noise )?gate\\b.*\\b(active|enabled?|on|on/off)\\b": 1.0
      "(doubler|transpose|tuner).*\\b(active|enabled?|on|on/off)\\b": 0.0
      "active (amp|cab) section|(amp|cab) section active|cab [lr12] active": 1.0   # amp and cab are never switched off
    ambience:
      - "active post fx section|post fx section active"       # chorus / delay / reverb block
    primary:
      - "\\bvolume 1\\b|\\bmaster 1\\b"   # Mesa Mark series: "Volume 1" is the gain knob
      - "\\bpull\\b|\\bclass\\b|\\bswitch\\b|\\bdeep\\b|\\bshift\\b"   # pull-pots and toggles
    excluded:
      - "gate.*(threshold|release|attack|hold)"   # leave gate at default
      - "doubler"
      - "transpose"
    # the amp channel selector ("Amp Type": Clean / Crunch / Lead) groups the "Clean …", "Crunch …",
    # "Lead …" knobs: only the selected channel's knobs are searched (see catalog.tag_plugin)
